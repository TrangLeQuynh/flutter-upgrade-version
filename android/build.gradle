group 'com.tranglequynh.flutter_upgrade_version'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '2.1.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Skip applying kotlin-android only when the consuming app opted into AGP's built-in Kotlin via
// android.builtInKotlin=true. Applying it on top of built-in Kotlin fails ("extension with name 'kotlin' already
// registered"), while dropping it unconditionally on AGP 9 would break apps that keep the flag at its default false:
// Flutter's FlutterPluginUtils.detectApplyingKotlinGradlePlugin decides whether to auto-apply kotlin-android by
// regex-matching the literal "apply plugin: 'kotlin-android'" text in this file — it does not evaluate the condition.
// Keeping the line present means Flutter stays out of the way, and this guard decides at runtime.
def builtInKotlinEnabled = (project.findProperty('android.builtInKotlin') ?: 'false').toString().toBoolean()

apply plugin: 'com.android.library'
if (!builtInKotlinEnabled) {
    apply plugin: 'kotlin-android'
}

android {
    /// Conditional for compatibility with AGP < 4.2
//    if (project.android.hasProperty("namespace")) {
    namespace 'com.tranglequynh.flutter_upgrade_version'
//    }
    compileSdk = 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdk = 21
    }
}

dependencies {
    implementation 'com.google.android.play:app-update:2.1.0'
    // For Kotlin users, also add the clean extensions library for Play In-App Update:
    implementation 'com.google.android.play:app-update-ktx:2.1.0'
}
